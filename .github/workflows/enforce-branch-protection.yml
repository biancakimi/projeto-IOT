name: Enforce Branch Protection (develop & main)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  protect-branches:
    name: Configurar Proteção de Branch (PR + Review + Aprovação)
    runs-on: ubuntu-latest
    steps:
      - name: Aplicar Regras de Proteção na branch develop e main via GitHub API
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.ADMIN_TOKEN || github.token }}
          script: |
            const branches = ['develop', 'main'];
            for (const branch of branches) {
              try {
                await github.rest.repos.updateBranchProtection({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch: branch,
                  required_status_checks: {
                    strict: true,
                    contexts: ['Automated Code Review & Validation']
                  },
                  enforce_admins: true,
                  required_pull_request_reviews: {
                    dismiss_stale_reviews: true,
                    require_code_owner_reviews: false,
                    required_approving_review_count: 1,
                    require_last_push_approval: true
                  },
                  restrictions: null,
                  allow_force_pushes: false,
                  allow_deletions: false
                });
                core.info(`Proteção aplicada com sucesso na branch: ${branch}`);
              } catch (err) {
                core.warning(`Aviso ao configurar ${branch}: ${err.message}. Caso esteja usando o GITHUB_TOKEN padrão, execute scripts/configure-branch-protection.ps1 com 'gh auth login'.`);
              }
            }
